<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Course Details</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2bee6c",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
              "text-light": "#0d1b12",
              "text-dark": "#e8f3ec",
              "card-light": "#e7f3eb",
              "card-dark": "#182d1e",
              "border-light": "#cfe7d7",
              "border-dark": "#294834",
              "accent-blue": "#38bdf8",
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative mx-auto flex h-auto min-h-screen w-full max-w-md flex-col text-text-light dark:text-text-dark group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex items-center bg-background-light/80 dark:bg-background-dark/80 p-4 pb-2 justify-between backdrop-blur-sm">
<button class="flex size-12 shrink-0 items-center justify-center rounded-full">
<span class="material-symbols-outlined text-text-light dark:text-text-dark">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Calculus I</h1>
<button class="flex size-12 shrink-0 cursor-pointer items-center justify-center rounded-full">
<span class="material-symbols-outlined text-text-light dark:text-text-dark">more_vert</span>
</button>
</header>
<main class="flex-1 px-4">
<!-- Circular Progress Ring -->
<div class="flex flex-col items-center justify-center py-8">
<div class="relative flex size-48 items-center justify-center">
<svg class="absolute inset-0 size-full -rotate-90 transform" viewbox="0 0 100 100">
<circle class="stroke-current text-card-light dark:text-card-dark" cx="50" cy="50" fill="transparent" r="45" stroke-width="10"></circle>
<circle class="stroke-current text-primary" cx="50" cy="50" fill="transparent" r="45" stroke-dasharray="282.74" stroke-dashoffset="33.92" stroke-linecap="round" stroke-width="10"></circle>
</svg>
<div class="flex flex-col items-center">
<span class="text-4xl font-bold tracking-tight text-text-light dark:text-text-dark">88%</span>
<span class="text-lg font-medium text-primary">B+</span>
</div>
</div>
</div>
<!-- Stats -->
<div class="flex flex-wrap gap-4">
<div class="flex min-w-[158px] flex-1 flex-col gap-2 rounded-xl p-5 bg-card-light dark:bg-card-dark">
<p class="text-base font-medium text-text-light/80 dark:text-text-dark/80">Credits</p>
<p class="tracking-light text-2xl font-bold text-text-light dark:text-text-dark">3</p>
</div>
<div class="flex min-w-[158px] flex-1 flex-col gap-2 rounded-xl p-5 bg-card-light dark:bg-card-dark">
<p class="text-base font-medium text-text-light/80 dark:text-text-dark/80">Instructor</p>
<p class="tracking-light text-2xl font-bold text-text-light dark:text-text-dark">Dr. Smith</p>
</div>
</div>
<!-- Grade Calculator Section -->
<section class="mt-8">
<h2 class="text-text-light dark:text-text-dark text-[22px] font-bold leading-tight tracking-[-0.015em] pb-3 pt-5">Grade Calculator</h2>
<div class="flex flex-col gap-4 rounded-xl bg-card-light dark:bg-card-dark p-4">
<!-- Slider 1 -->
<div class="@container">
<div class="relative flex w-full flex-col items-start justify-between gap-3 @[480px]:flex-row @[480px]:items-center">
<div class="flex w-full shrink-[3] items-center justify-between">
<p class="text-base font-medium text-text-light dark:text-text-dark">Midterm - 30%</p>
<p class="text-sm font-normal text-text-light/80 dark:text-text-dark/80 @[480px]:hidden">85%</p>
</div>
<div class="flex h-4 w-full items-center gap-4">
<div class="flex h-1.5 flex-1 rounded-full bg-border-light dark:bg-border-dark">
<div class="relative h-full w-[85%] rounded-full bg-primary">
<div class="absolute -right-2 -top-1.5 size-5 rounded-full border-4 border-primary bg-background-light dark:bg-background-dark"></div>
</div>
</div>
<p class="hidden text-sm font-normal text-text-light/80 dark:text-text-dark/80 @[480px]:block">85%</p>
</div>
</div>
</div>
<!-- Slider 2 -->
<div class="@container">
<div class="relative flex w-full flex-col items-start justify-between gap-3 @[480px]:flex-row @[480px]:items-center">
<div class="flex w-full shrink-[3] items-center justify-between">
<p class="text-base font-medium text-text-light dark:text-text-dark">Final - 40%</p>
<p class="text-sm font-normal text-text-light/80 dark:text-text-dark/80 @[480px]:hidden">92%</p>
</div>
<div class="flex h-4 w-full items-center gap-4">
<div class="flex h-1.5 flex-1 rounded-full bg-border-light dark:bg-border-dark">
<div class="relative h-full w-[92%] rounded-full bg-accent-blue">
<div class="absolute -right-2 -top-1.5 size-5 rounded-full border-4 border-accent-blue bg-background-light dark:bg-background-dark"></div>
</div>
</div>
<p class="hidden text-sm font-normal text-text-light/80 dark:text-text-dark/80 @[480px]:block">92%</p>
</div>
</div>
</div>
<button class="mt-2 flex w-full cursor-pointer items-center justify-center rounded-lg bg-primary h-12 text-base font-bold text-text-light dark:text-background-dark">See Projected Grade</button>
</div>
</section>
<!-- Assignments List -->
<section class="mt-8 pb-8">
<h2 class="text-text-light dark:text-text-dark text-[22px] font-bold leading-tight tracking-[-0.015em] pb-3 pt-5">Assignments</h2>
<div class="flex flex-col gap-3">
<!-- Assignment Item 1 -->
<div class="flex items-center justify-between rounded-xl bg-card-light dark:bg-card-dark p-4">
<div>
<p class="font-medium text-text-light dark:text-text-dark">Homework 1</p>
<p class="text-sm text-text-light/70 dark:text-text-dark/70">Weight: 5%</p>
</div>
<div class="text-right">
<p class="font-bold text-primary">100/100</p>
<p class="text-sm text-text-light/70 dark:text-text-dark/70">A+</p>
</div>
</div>
<!-- Assignment Item 2 -->
<div class="flex items-center justify-between rounded-xl bg-card-light dark:bg-card-dark p-4">
<div>
<p class="font-medium text-text-light dark:text-text-dark">Quiz 1</p>
<p class="text-sm text-text-light/70 dark:text-text-dark/70">Weight: 10%</p>
</div>
<div class="text-right">
<p class="font-bold text-text-light dark:text-text-dark">85/100</p>
<p class="text-sm text-text-light/70 dark:text-text-dark/70">B</p>
</div>
</div>
<!-- Assignment Item 3 -->
<div class="flex items-center justify-between rounded-xl bg-card-light dark:bg-card-dark p-4">
<div>
<p class="font-medium text-text-light dark:text-text-dark">Homework 2</p>
<p class="text-sm text-text-light/70 dark:text-text-dark/70">Weight: 5%</p>
</div>
<div class="text-right">
<p class="font-bold text-text-light dark:text-text-dark">95/100</p>
<p class="text-sm text-text-light/70 dark:text-text-dark/70">A</p>
</div>
</div>
<!-- Assignment Item 4 -->
<div class="flex items-center justify-between rounded-xl bg-card-light dark:bg-card-dark p-4">
<div>
<p class="font-medium text-text-light dark:text-text-dark">Midterm</p>
<p class="text-sm text-text-light/70 dark:text-text-dark/70">Weight: 30%</p>
</div>
<div class="text-right">
<p class="font-bold text-text-light dark:text-text-dark">85/100</p>
<p class="text-sm text-text-light/70 dark:text-text-dark/70">B</p>
</div>
</div>
</div>
</section>
</main>
</div>
</body></html>
