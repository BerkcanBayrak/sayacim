<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add New Class</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#7f55f1",
            "background-light": "#f6f6f8",
            "background-dark": "#151022",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col bg-background-dark dark group/design-root overflow-x-hidden" style="--select-button-svg: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724px%27 height=%2724px%27 fill=%27rgb(160,146,201)%27 viewBox=%270 0 256 256%27%3e%3cpath d=%27M181.66,170.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-48-48a8,8,0,0,1,11.32-11.32L128,212.69l42.34-42.35A8,8,0,0,1,181.66,170.34Zm-96-84.68L128,43.31l42.34,42.35a8,8,0,0,0,11.32-11.32l-48-48a8,8,0,0,0-11.32,0l-48-48A8,8,0,0,0,85.66,85.66Z%27%3e%3c/path%3e%3c/svg%3e');">
<!-- Top App Bar -->
<div class="flex items-center bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-white flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center -ml-12">Add New Class</h2>
</div>
<div class="flex-grow overflow-y-auto px-4">
<div class="flex flex-col gap-6 pt-4">
<!-- Course Name TextField/Dropdown -->
<label class="flex flex-col w-full">
<p class="text-white text-base font-medium leading-normal pb-2">Course Name</p>
<select class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-0 border border-[#403267] bg-[#201933] focus:border-primary focus:ring-2 focus:ring-primary/50 h-14 bg-[image:--select-button-svg] placeholder:text-[#a092c9] p-[15px] text-base font-normal leading-normal appearance-none bg-no-repeat bg-[center_right_1rem]">
<option disabled="" selected="" value="">Select a course</option>
<option value="math101">Calculus I</option>
<option value="cs201">Data Structures &amp; Algorithms</option>
<option value="phy305">Quantum Mechanics</option>
</select>
</label>
<!-- Day of the Week Chips -->
<div>
<p class="text-white text-base font-normal leading-normal pb-3 pt-1">Day of the Week</p>
<div class="flex gap-2.5 overflow-x-auto pb-2 -mx-4 px-4">
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-xl bg-primary pl-4 pr-4"><p class="text-white text-sm font-medium leading-normal">Mon</p></div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-xl bg-[#2d2348] pl-4 pr-4"><p class="text-white text-sm font-medium leading-normal">Tue</p></div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-xl bg-[#2d2348] pl-4 pr-4"><p class="text-white text-sm font-medium leading-normal">Wed</p></div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-xl bg-[#2d2348] pl-4 pr-4"><p class="text-white text-sm font-medium leading-normal">Thu</p></div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-xl bg-[#2d2348] pl-4 pr-4"><p class="text-white text-sm font-medium leading-normal">Fri</p></div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-xl bg-[#2d2348] pl-4 pr-4"><p class="text-white text-sm font-medium leading-normal">Sat</p></div>
<div class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-xl bg-[#2d2348] pl-4 pr-4"><p class="text-white text-sm font-medium leading-normal">Sun</p></div>
</div>
</div>
<!-- Time Pickers -->
<div class="flex items-center justify-between gap-4">
<!-- Start Time -->
<div class="flex-1">
<p class="text-white text-base font-normal leading-normal pb-3 pt-1">Start Time</p>
<div class="flex bg-[#201933] rounded-xl p-2 border border-[#403267]">
<div class="group flex-1">
<p class="text-[#58458c] text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">09</p>
<p class="text-white text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">10</p>
<p class="text-[#58458c] text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">11</p>
</div>
<div class="flex items-center text-white text-2xl font-bold">:</div>
<div class="group flex-1">
<p class="text-[#58458c] text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">20</p>
<p class="text-white text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">30</p>
<p class="text-[#58458c] text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">40</p>
</div>
</div>
</div>
<!-- End Time -->
<div class="flex-1">
<p class="text-white text-base font-normal leading-normal pb-3 pt-1">End Time</p>
<div class="flex bg-[#201933] rounded-xl p-2 border border-[#403267]">
<div class="group flex-1">
<p class="text-[#58458c] text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">10</p>
<p class="text-white text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">11</p>
<p class="text-[#58458c] text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">12</p>
</div>
<div class="flex items-center text-white text-2xl font-bold">:</div>
<div class="group flex-1">
<p class="text-[#58458c] text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">50</p>
<p class="text-white text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">00</p>
<p class="text-[#58458c] text-2xl font-bold leading-normal tracking-[0.015em] flex h-11 items-center justify-center truncate text-center">10</p>
</div>
</div>
</div>
</div>
<!-- Classroom / Location TextField -->
<label class="flex flex-col w-full">
<p class="text-white text-base font-medium leading-normal pb-2">Classroom / Location</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-0 border border-[#403267] bg-[#201933] focus:border-primary focus:ring-2 focus:ring-primary/50 h-14 placeholder:text-[#a092c9] px-[15px] text-base font-normal leading-normal" placeholder="e.g. Room 404, Building B" type="text"/>
</label>
</div>
</div>
<!-- CTA Button -->
<div class="sticky bottom-0 bg-background-dark p-4 pt-2">
<button class="flex h-14 w-full items-center justify-center rounded-xl bg-primary text-base font-bold text-white transition-colors hover:bg-primary/90">Add to Schedule</button>
</div>
</div>
</body></html>
